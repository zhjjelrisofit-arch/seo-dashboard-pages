<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<meta name="description" content="JF &amp; VJ SEO Dashboard 本地前端演示"/>
<link rel="stylesheet" href="./css/styles.css"/>
<title>JF &amp; VJ · SEO Dashboard</title>

</head><body>
<section id="gate" aria-label="企业邮箱入口">
 <div class="gate-shell">
  <div class="gate-art"><div><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>SEO Dashboard</h1><p>JelriSoFit &amp; VyblooJug 自然搜索表现</p></div></div>
<form class="gate-form" id="gateForm" novalidate><div class="over">SEARCH INTELLIGENCE</div><h2>进入看板</h2><label for="gateEmail">企业邮箱地址</label><input class="gate-input" type="email" id="gateEmail" autocomplete="email" placeholder="请输入企业邮箱" required/><div class="gate-error" id="gateError" role="alert"></div><button class="gate-enter" type="submit" disabled>进入 →</button></form>
 </div>
</section>
<section id="app">
 <aside class="sidebar">
  <a class="sb-title" href="#overview" aria-label="返回SEO总览"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>SEO Dashboard</span></a>
  <span class="side-label">ANALYTICS</span>
  <nav aria-label="看板导航">
   <button type="button" class="nav-btn" data-nav="overview"><span class="ni">▥</span>SEO 总览</button>
   <button type="button" class="nav-btn" data-nav="jf"><span class="ni nb">JF</span>JF 分析</button>
   <button type="button" class="nav-btn" data-nav="vj"><span class="ni nb vj">VJ</span>VJ 分析</button>
  </nav>
  <div class="space"></div><div class="sb-bottom"><button type="button" class="nav-btn" data-action="manage"><span class="ni">⚙</span>数据管理 <span style="margin-left:auto;opacity:.6">↗</span></button></div>
 </aside>
 <main class="main"><div class="container" id="view"></div></main>
</section>
<div class="modal-shade" id="dateModal" role="presentation"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dateTitle"><h2 id="dateTitle">自定义日期</h2><p>日期为美国太平洋时间（PT）</p><label for="startDate">开始日期</label><input id="startDate" type="date"/><label for="endDate">结束日期</label><input id="endDate" type="date"/><div class="modal-error" id="dateError" role="alert"></div><div class="modal-actions"><button type="button" class="small-btn" data-action="close-date">取消</button><button type="button" class="primary-btn" data-action="apply-date">应用日期</button></div></div></div>
<div class="modal-shade" id="statusModal" role="presentation"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="statusTitle"><h2 id="statusTitle">数据来源状态</h2><p>品牌词数据来自 GSC 官方 Branded 导出；品类词数据来自 GSC API + 755 词固定词库匹配</p><table class="status-table"><tbody><tr><td>JF · 官方品牌词Excel</td><td id="statusJf">加载中…</td></tr><tr><td>JF · 自定义品类API</td><td id="statusCatJf">加载中…</td></tr><tr><td>VJ · 官方品牌词Excel</td><td id="statusVj">加载中…</td></tr><tr><td>VJ · 自定义品类API</td><td id="statusCatVj">加载中…</td></tr></tbody></table><div class="modal-actions"><button type="button" class="primary-btn" data-action="close-status">关闭</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="./js/app.js"></script>
</body></html>
